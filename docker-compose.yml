# Local/production-like stack: PostgreSQL, the API and the admin portal.
# The mobile app runs on phones via Expo and points at the API's address.
#
#   cp .env.example .env   # fill in POSTGRES_PASSWORD and JWT_ACCESS_SECRET
#   docker compose up -d --build
#   docker compose exec api sh -c 'ADMIN_NAME="..." ADMIN_EMAIL="..." ADMIN_PASSWORD="..." node dist/database/bootstrap.js'
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sda_shs
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: sda_shs
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sda_shs']
      interval: 5s
      retries: 10

  api:
    build: { context: ., dockerfile: docker/api.Dockerfile }
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      DATABASE_URL: postgres://sda_shs:${POSTGRES_PASSWORD}@db:5432/sda_shs
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET in .env}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-0}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      LOCAL_STORAGE_DIR: /app/uploads
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-auto}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      EXPO_PUSH_ENABLED: ${EXPO_PUSH_ENABLED:-false}
      EXPO_ACCESS_TOKEN: ${EXPO_ACCESS_TOKEN:-}
    volumes:
      - uploads:/app/uploads
    ports:
      - '4000:4000'

  web-admin:
    build: { context: ., dockerfile: docker/web-admin.Dockerfile }
    restart: unless-stopped
    depends_on: [api]
    environment:
      API_URL: http://api:4000
    ports:
      - '3000:3000'

volumes:
  db-data:
  uploads:
